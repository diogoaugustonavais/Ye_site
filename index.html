<!DOCTYPE html>
<html lang="pt-BR">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Imagens HTML</title>
</head>

<body>

	<h1>Inserindo Imagens</h1>

	<!--
		a tag <img> insere uma imagem.

		scr:
		caminho do arquivo.

		alt:
		descrição da imagem.
		é impotante para acessibilidade e também
		quando a imagem não consegue ser carregada.
	-->

	<!--
 		este exemplo espera uma imagem chamada computador.jpg dentro da pasta img.
	-->
	<img
		src="image/COMP.jpg"
		alt="Computador utilizado para desenvolvimento de sistemas"
		width="500"
	>
	
	<p>
		o atributo width está sendo utilizado apenas para controlar o tamanho da imagem nesse exemplo. Depois faremos esse tipo de ajuste com CSS.

	</p>
</body>
</html>
