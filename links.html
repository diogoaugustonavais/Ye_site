<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Links Html</title>
</head>

<body>
	<h1>Trabalhando com links</h1>
	<!-- a tag <a> cria um link.
	o atributp href informa o destino.
	-->
	<a href="https://www.google.com"> Acessar o Google </a>

	<br><br>

	<!-- target="_blank" abre o link em outra aba.
	rel="noopener noreferrer" e uma boa pratica para links externos abertos em outra aba. -->
	<a
		href="https://developer.mozilla.org/"
		target="_blank"
		rel="noopener noreferrer"
	>
		Acessar a documentação MDN
	</a>

	<br><br>
	<!--	tambem podemos navegar entre arquivos HTML que esteja na mesma pasta.  -->
	<a href="02_titulos_paragrafos.html"> Voltar para o exemplo anterior
	</a>
</body
</html>
